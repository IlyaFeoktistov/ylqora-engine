name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# Новый пуш в ту же ветку отменяет недоделанную проверку прошлого.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Та же версия, что ждёт хук .githooks/pre-commit: другие форматируют чуть иначе.
      - run: pip install clang-format==23.1.3
      - run: make format-check

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Тот же список пакетов, что в README: заголовки для видео-подсистемы SDL3.
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libdecor-0-dev
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      # UCRT64 - та же связка, что WinLibs UCRT на машине разработчика: MinGW GCC, не MSVC.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug
